<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1920px;
    background:#2a2520;
    font-family:'DM Sans',Arial,Helvetica,sans-serif;
    overflow:hidden;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(60px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity:0; transform:translateY(-40px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity:0; transform:scale(0.5); }
    to { opacity:1; transform:scale(1); }
  }
  @keyframes scalePop {
    0% { opacity:0; transform:scale(0.3); }
    70% { opacity:1; transform:scale(1.15); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes shakeNo {
    0%, 100% { transform:translateX(0); }
    20% { transform:translateX(-12px); }
    40% { transform:translateX(12px); }
    60% { transform:translateX(-8px); }
    80% { transform:translateX(8px); }
  }
  @keyframes gentleSway {
    0%, 100% { transform:rotate(0deg); }
    25% { transform:rotate(3deg); }
    75% { transform:rotate(-3deg); }
  }
  @keyframes slideInLeft {
    from { opacity:0; transform:translateX(-120px); }
    to { opacity:1; transform:translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity:0; transform:translateX(120px); }
    to { opacity:1; transform:translateX(0); }
  }
  @keyframes strikethrough {
    from { width: 0; }
    to { width: 100%; }
  }
  @keyframes dropIn {
    0% { opacity:0; transform:translateY(-200px) rotate(-10deg); }
    60% { opacity:1; transform:translateY(20px) rotate(2deg); }
    80% { transform:translateY(-8px) rotate(-1deg); }
    100% { opacity:1; transform:translateY(0) rotate(0deg); }
  }
  @keyframes float {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-15px); }
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 20px rgba(154,176,106,0.3); }
    50% { text-shadow: 0 0 40px rgba(154,176,106,0.8), 0 0 80px rgba(154,176,106,0.4); }
  }
  @keyframes checkmark {
    0% { opacity:0; transform:scale(0) rotate(-45deg); }
    60% { opacity:1; transform:scale(1.3) rotate(5deg); }
    100% { opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes bounceIn {
    0% { opacity:0; transform:scale(0.3); }
    50% { opacity:1; transform:scale(1.1); }
    70% { transform:scale(0.9); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes pulseGrow {
    0%, 100% { transform:scale(1); }
    50% { transform:scale(1.05); }
  }
  @keyframes wiggle {
    0%, 100% { transform:rotate(0); }
    25% { transform:rotate(-5deg); }
    75% { transform:rotate(5deg); }
  }
</style>
</head><body>
<div style="width:100%;height:100%;position:relative">

  <!-- Title - BIG on top -->
  <div style="position:absolute;top:80px;left:0;right:0;text-align:center;z-index:10;
    opacity:0; animation: fadeInDown 0.6s ease-out 0.3s forwards;">
    <div style="font-family:Georgia,'Times New Roman',serif;font-size:72px;
      color:#f5f0e8;line-height:1.0;font-weight:700">
      my brain has<br>47 tabs open</div>
  </div>

  <!-- Chaotic text scattered -->
  <div style="position:absolute;top:0;left:0;width:100%;height:100%">
    
        <div style="position:absolute;left:60px;top:250px;
          opacity:0; animation: fadeIn 0.3s ease-out 1.0s forwards;
          font-size:24px;color:rgba(245,240,232,0.4);
          transform:rotate(-8deg);white-space:nowrap">
          did I lock the door</div>
        <div style="position:absolute;left:500px;top:400px;
          opacity:0; animation: fadeIn 0.3s ease-out 1.3s forwards;
          font-size:26px;color:rgba(245,240,232,0.4);
          transform:rotate(5deg);white-space:nowrap">
          what was I doing</div>
        <div style="position:absolute;left:80px;top:550px;
          opacity:0; animation: fadeIn 0.3s ease-out 1.6s forwards;
          font-size:30px;color:rgba(245,240,232,0.4);
          transform:rotate(-3deg);white-space:nowrap">
          WHERE ARE MY KEYS</div>
        <div style="position:absolute;left:620px;top:220px;
          opacity:0; animation: fadeIn 0.3s ease-out 1.9s forwards;
          font-size:22px;color:rgba(245,240,232,0.4);
          transform:rotate(12deg);white-space:nowrap">
          is it tuesday</div>
        <div style="position:absolute;left:150px;top:700px;
          opacity:0; animation: fadeIn 0.3s ease-out 2.2s forwards;
          font-size:24px;color:rgba(245,240,232,0.4);
          transform:rotate(-6deg);white-space:nowrap">
          forgot to eat</div>
        <div style="position:absolute;left:400px;top:650px;
          opacity:0; animation: fadeIn 0.3s ease-out 2.5s forwards;
          font-size:26px;color:rgba(245,240,232,0.4);
          transform:rotate(8deg);white-space:nowrap">
          why did I walk in here</div>
        <div style="position:absolute;left:100px;top:850px;
          opacity:0; animation: fadeIn 0.3s ease-out 2.8s forwards;
          font-size:28px;color:rgba(245,240,232,0.4);
          transform:rotate(-10deg);white-space:nowrap">
          DID I REPLY</div>
        <div style="position:absolute;left:550px;top:820px;
          opacity:0; animation: fadeIn 0.3s ease-out 3.1s forwards;
          font-size:24px;color:rgba(245,240,232,0.4);
          transform:rotate(4deg);white-space:nowrap">
          is the stove on</div>
  </div>

  <!-- Dark overlay wipes chaos -->
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;
    background:#2a2520;opacity:0;animation: fadeIn 1.5s ease-out 5.0s forwards;
    z-index:5"></div>

  <!-- Peaceful reveal on top -->
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:40px;z-index:10;padding:80px 60px">

    <div style="opacity:0; animation: fadeInUp 0.8s ease-out 6.5s forwards;
      font-family:Georgia,'Times New Roman',serif;font-size:60px;
      color:#9ab06a;line-height:1.05;font-weight:700">
      but this tab<br>is just a<br>quiet garden.</div>

    <div style="opacity:0; animation: scaleIn 1s ease-out 8.0s forwards;">
      <div style="animation: float 3s ease-in-out 9.5s infinite;">
        <svg viewBox="0 0 120 140" width="400" height="450" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="60" cy="134" rx="24" ry="3" fill="rgba(0,0,0,0.08)"/>
  <path d="M 38 100 L 42 128 Q 60 132 78 128 L 82 100 Z" fill="#E8DCC8"/>
  <ellipse cx="60" cy="100" rx="23" ry="5" fill="#cabeaa"/>
  <ellipse cx="60" cy="100" rx="20" ry="3.5" fill="#5C4A2A"/>
  <path d="M 60 100 Q 58 80 50 60 Q 44 48 42 38 Q 42 30 48 24 Q 55 20 65 22 Q 75 26 80 35" stroke="#4A7A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <line x1="62" y1="100" x2="62" y2="30" stroke="#8B7355" stroke-width="1.2"/>
  <g transform="translate(48,24)"><ellipse cx="-5" cy="0" rx="5" ry="4" fill="#E8B0D0" opacity="0.85"/><ellipse cx="5" cy="0" rx="5" ry="4" fill="#E8B0D0" opacity="0.85"/><ellipse cx="0" cy="-5" rx="4" ry="3.5" fill="#F0C8E0" opacity="0.8"/><ellipse cx="0" cy="5" rx="3.5" ry="4" fill="#F0C8E0" opacity="0.7"/><circle cx="0" cy="0" r="2.5" fill="#D090B8"/><circle cx="0" cy="0" r="1" fill="#C06090"/></g>
  <g transform="translate(65,20)"><ellipse cx="-4.5" cy="0" rx="4.5" ry="3.5" fill="#E8B0D0" opacity="0.8"/><ellipse cx="4.5" cy="0" rx="4.5" ry="3.5" fill="#E8B0D0" opacity="0.8"/><circle cx="0" cy="0" r="2" fill="#D090B8"/></g>
  <g transform="translate(76,32)"><ellipse cx="-3.5" cy="0" rx="3.5" ry="2.5" fill="#E8B0D0" opacity="0.7"/><ellipse cx="3.5" cy="0" rx="3.5" ry="2.5" fill="#E8B0D0" opacity="0.7"/></g>
  <ellipse cx="80" cy="35" rx="2.5" ry="3.5" fill="#C8A0B8" opacity="0.5"/>
  <path d="M 58 100 Q 40 92 25 88 Q 22 90 28 94 Q 38 96 56 100 Z" fill="#2E7D32"/>
  <path d="M 62 100 Q 80 92 95 88 Q 98 90 92 94 Q 82 96 64 100 Z" fill="#388E3C"/>
  <path d="M 56 100 Q 44 96 35 95 Q 34 97 40 99 Q 48 100 56 100 Z" fill="#43A047"/>
</svg>
      </div>
    </div>

    <div style="opacity:0; animation: fadeIn 0.3s ease-out 10.0s forwards;
      font-size:16px;color:#9a8f84;letter-spacing:2px">bloomday.app</div>
  </div>
</div></body></html>
