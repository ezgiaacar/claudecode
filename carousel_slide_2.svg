<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#FAFAF7"/>

  <!-- Main text -->
  <text x="540" y="440" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#2A2A2A" letter-spacing="-1">I have ADHD.</text>

  <!-- Second line -->
  <text x="540" y="560" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#666" letter-spacing="0.5">I've had it since I was a kid.</text>

