<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1920px;
    background:#2a2520;
    font-family:'DM Sans',Arial,Helvetica,sans-serif;
    overflow:hidden;
  }
  .footer {
    position:absolute; bottom:40px; left:0; right:0;
    text-align:center; z-index:100;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(60px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity:0; transform:translateY(-40px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity:0; transform:scale(0.5); }
    to { opacity:1; transform:scale(1); }
  }
  @keyframes scalePop {
    0% { opacity:0; transform:scale(0.3); }
    70% { opacity:1; transform:scale(1.15); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes shakeNo {
    0%, 100% { transform:translateX(0); }
    20% { transform:translateX(-12px); }
    40% { transform:translateX(12px); }
    60% { transform:translateX(-8px); }
    80% { transform:translateX(8px); }
  }
  @keyframes gentleSway {
    0%, 100% { transform:rotate(0deg); }
    25% { transform:rotate(3deg); }
    75% { transform:rotate(-3deg); }
  }
  @keyframes slideInLeft {
    from { opacity:0; transform:translateX(-120px); }
    to { opacity:1; transform:translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity:0; transform:translateX(120px); }
    to { opacity:1; transform:translateX(0); }
  }
  @keyframes strikethrough {
    from { width: 0; }
    to { width: 100%; }
  }
  @keyframes dropIn {
    0% { opacity:0; transform:translateY(-200px) rotate(-10deg); }
    60% { opacity:1; transform:translateY(20px) rotate(2deg); }
    80% { transform:translateY(-8px) rotate(-1deg); }
    100% { opacity:1; transform:translateY(0) rotate(0deg); }
  }
  @keyframes float {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-15px); }
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 20px rgba(154,176,106,0.3); }
    50% { text-shadow: 0 0 40px rgba(154,176,106,0.8), 0 0 80px rgba(154,176,106,0.4); }
  }
  @keyframes checkmark {
    0% { opacity:0; transform:scale(0) rotate(-45deg); }
    60% { opacity:1; transform:scale(1.3) rotate(5deg); }
    100% { opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes slideUp {
    from { opacity:0; transform:translateY(100px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes crossOut {
    from { text-decoration-color: transparent; }
    to { text-decoration-color: currentColor; }
  }
  @keyframes bounceIn {
    0% { opacity:0; transform:scale(0.3); }
    50% { opacity:1; transform:scale(1.1); }
    70% { transform:scale(0.9); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes pulseGrow {
    0%, 100% { transform:scale(1); }
    50% { transform:scale(1.05); }
  }
  @keyframes wiggle {
    0%, 100% { transform:rotate(0); }
    25% { transform:rotate(-5deg); }
    75% { transform:rotate(5deg); }
  }
</style>
</head><body style="position:relative">
<div style="width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;padding:100px 60px 120px;
  text-align:center">

  <!-- Title -->
  <div style="opacity:0; animation: fadeInDown 0.6s ease-out 0.3s forwards;">
    <div style="font-family:Georgia,'Times New Roman',serif;font-size:52px;
      color:#f5f0e8;line-height:1.1">the freeze.</div>
    <div style="font-size:18px;color:#9a8f84;margin-top:12px;letter-spacing:1px">
      (you know the one)</div>
  </div>

  <!-- Paralysis lines fade in -->
  <div style="display:flex;flex-direction:column;gap:0;text-align:center">
    
        <div style="opacity:0; animation: fadeIn 0.4s ease-out 1.0s forwards;
          font-size:28px;color:#9a8f84;line-height:1.8;font-style:italic">
          can't start the project</div>
        <div style="opacity:0; animation: fadeIn 0.4s ease-out 1.8s forwards;
          font-size:28px;color:#9a8f84;line-height:1.8;font-style:italic">
          can't answer the email</div>
        <div style="opacity:0; animation: fadeIn 0.4s ease-out 2.6s forwards;
          font-size:28px;color:#9a8f84;line-height:1.8;font-style:italic">
          can't make the phone call</div>
        <div style="opacity:0; animation: fadeIn 0.4s ease-out 3.4s forwards;
          font-size:28px;color:#9a8f84;line-height:1.8;font-style:italic">
          can't do the dishes</div>
        <div style="opacity:0; animation: fadeIn 0.4s ease-out 4.2s forwards;
          font-size:28px;color:#9a8f84;line-height:1.8;font-style:italic">
          can't even get up</div>
  </div>

  <!-- Divider beat -->
  <div style="opacity:0; animation: fadeIn 0.3s ease-out 5.5s forwards;
    width:60px;height:3px;background:rgba(255,255,255,0.1)"></div>

  <!-- The unlock -->
  <div style="opacity:0; animation: fadeInUp 0.8s ease-out 6.5s forwards;
    font-family:Georgia,'Times New Roman',serif;font-size:28px;
    color:#f5f0e8;line-height:1.4">
    then you open bloomday.<br>and do one tiny thing.</div>

  <!-- Task chip -->
  <div style="opacity:0; animation: bounceIn 0.6s ease-out 8.0s forwards;
    background:rgba(154,176,106,0.15);border:2px solid #9ab06a;border-radius:20px;
    padding:16px 36px;display:inline-flex;align-items:center;gap:12px">
    <div style="width:28px;height:28px;border-radius:50%;border:2px solid #9ab06a;
      display:flex;align-items:center;justify-content:center;
      opacity:0; animation: checkmark 0.5s ease-out 9.0s forwards;
      background:#9ab06a">
      <span style="color:#2a2520;font-size:18px;font-weight:700">✓</span>
    </div>
    <div style="font-size:24px;color:#9ab06a">"drink water"</div>
  </div>

  <!-- Plant grows -->
  <div style="opacity:0; animation: scaleIn 1s ease-out 9.8s forwards;">
    <div style="animation: gentleSway 3s ease-in-out 11s infinite;">
      <svg viewBox="0 0 120 140" width="200" height="225" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="60" cy="134" rx="24" ry="3" fill="rgba(0,0,0,0.08)"/>
  <path d="M 38 100 L 42 128 Q 60 132 78 128 L 82 100 Z" fill="#8B7355"/>
  <ellipse cx="60" cy="100" rx="23" ry="5" fill="#6d5537"/>
  <ellipse cx="60" cy="100" rx="20" ry="3.5" fill="#5C4A2A"/>
  <path d="M 50 100 Q 48 65 46 25 Q 47 20 50 18 Q 53 20 52 25 Q 52 65 51 100 Z" fill="#2E7D32"/>
  <path d="M 50 100 Q 48 65 47 30" stroke="#FDD835" stroke-width="0.8" opacity="0.25" fill="none"/>
  <path d="M 49 55 Q 51 53 53 55" stroke="#1B5E20" stroke-width="0.4" opacity="0.3" fill="none"/>
  <path d="M 56 100 Q 55 60 53 22 Q 55 16 58 14 Q 61 16 60 22 Q 58 60 57 100 Z" fill="#1B5E20"/>
  <path d="M 56 100 Q 55 60 54 28" stroke="#FDD835" stroke-width="0.8" opacity="0.2" fill="none"/>
  <path d="M 62 100 Q 63 55 65 20 Q 66 15 68 13 Q 71 15 70 20 Q 68 55 67 100 Z" fill="#388E3C"/>
  <path d="M 62 100 Q 63 55 65 25" stroke="#FDD835" stroke-width="0.7" opacity="0.25" fill="none"/>
  <path d="M 45 100 Q 43 72 40 38 Q 41 33 43 31 Q 46 33 45 38 Q 44 72 44 100 Z" fill="#43A047"/>
  <path d="M 70 100 Q 72 68 74 35 Q 75 30 77 28 Q 79 30 78 35 Q 76 68 75 100 Z" fill="#2E7D32"/>
</svg>
    </div>
  </div>

  <!-- Punchline -->
  <div style="opacity:0; animation: fadeInUp 0.6s ease-out 11.5s forwards;
    font-family:Georgia,'Times New Roman',serif;font-size:32px;
    color:#9ab06a;font-style:italic">
    the freeze thawed a little.</div>

  <div style="opacity:0; animation: fadeIn 0.3s ease-out 12.5s forwards;
    font-size:18px;color:#9a8f84">
    that's enough. that's the whole point.</div>
</div>

    <div class="footer" style="opacity:0; animation: fadeIn 0.4s ease-out 13.5s forwards;">
      <div style="font-size:15px;color:#9a8f84;letter-spacing:2px">
        bloomday.app · free forever</div>
    </div></body></html>
