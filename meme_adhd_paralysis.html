<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1920px;
    background:#2a2520;
    font-family:'DM Sans',Arial,Helvetica,sans-serif;
    overflow:hidden;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(60px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity:0; transform:translateY(-40px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity:0; transform:scale(0.5); }
    to { opacity:1; transform:scale(1); }
  }
  @keyframes scalePop {
    0% { opacity:0; transform:scale(0.3); }
    70% { opacity:1; transform:scale(1.15); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes shakeNo {
    0%, 100% { transform:translateX(0); }
    20% { transform:translateX(-12px); }
    40% { transform:translateX(12px); }
    60% { transform:translateX(-8px); }
    80% { transform:translateX(8px); }
  }
  @keyframes gentleSway {
    0%, 100% { transform:rotate(0deg); }
    25% { transform:rotate(3deg); }
    75% { transform:rotate(-3deg); }
  }
  @keyframes slideInLeft {
    from { opacity:0; transform:translateX(-120px); }
    to { opacity:1; transform:translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity:0; transform:translateX(120px); }
    to { opacity:1; transform:translateX(0); }
  }
  @keyframes strikethrough {
    from { width: 0; }
    to { width: 100%; }
  }
  @keyframes dropIn {
    0% { opacity:0; transform:translateY(-200px) rotate(-10deg); }
    60% { opacity:1; transform:translateY(20px) rotate(2deg); }
    80% { transform:translateY(-8px) rotate(-1deg); }
    100% { opacity:1; transform:translateY(0) rotate(0deg); }
  }
  @keyframes float {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-15px); }
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 20px rgba(154,176,106,0.3); }
    50% { text-shadow: 0 0 40px rgba(154,176,106,0.8), 0 0 80px rgba(154,176,106,0.4); }
  }
  @keyframes checkmark {
    0% { opacity:0; transform:scale(0) rotate(-45deg); }
    60% { opacity:1; transform:scale(1.3) rotate(5deg); }
    100% { opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes bounceIn {
    0% { opacity:0; transform:scale(0.3); }
    50% { opacity:1; transform:scale(1.1); }
    70% { transform:scale(0.9); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes pulseGrow {
    0%, 100% { transform:scale(1); }
    50% { transform:scale(1.05); }
  }
  @keyframes wiggle {
    0%, 100% { transform:rotate(0); }
    25% { transform:rotate(-5deg); }
    75% { transform:rotate(5deg); }
  }
</style>
</head><body>
<div style="width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:50px;padding:80px 60px;
  text-align:center">

  <!-- Title - BIG -->
  <div style="opacity:0; animation: fadeInDown 0.8s ease-out 0.3s forwards;
    font-family:Georgia,'Times New Roman',serif;font-size:80px;
    color:#f5f0e8;line-height:1.0;font-weight:700">
    the freeze.</div>

  <!-- Short freeze lines -->
  <div style="display:flex;flex-direction:column;gap:8px;text-align:center">
    <div style="opacity:0; animation: fadeIn 0.4s ease-out 1.5s forwards;
      font-size:32px;color:#9a8f84;font-style:italic">can't start</div>
    <div style="opacity:0; animation: fadeIn 0.4s ease-out 2.2s forwards;
      font-size:32px;color:#9a8f84;font-style:italic">can't move</div>
    <div style="opacity:0; animation: fadeIn 0.4s ease-out 2.9s forwards;
      font-size:32px;color:#9a8f84;font-style:italic">can't even get up</div>
  </div>

  <!-- Task chip pops -->
  <div style="opacity:0; animation: bounceIn 0.6s ease-out 4.5s forwards;
    background:rgba(154,176,106,0.15);border:2px solid #9ab06a;border-radius:24px;
    padding:20px 44px;display:inline-flex;align-items:center;gap:16px">
    <div style="width:36px;height:36px;border-radius:50%;background:#9ab06a;
      display:flex;align-items:center;justify-content:center;
      opacity:0; animation: checkmark 0.5s ease-out 5.5s forwards;">
      <span style="color:#2a2520;font-size:22px;font-weight:700">✓</span>
    </div>
    <div style="font-size:30px;color:#9ab06a">"drink water"</div>
  </div>

  <!-- BIG plant hero -->
  <div style="opacity:0; animation: scaleIn 1.2s ease-out 6.5s forwards;">
    <div style="animation: gentleSway 3s ease-in-out 8s infinite;">
      <svg viewBox="0 0 120 140" width="400" height="450" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="60" cy="134" rx="24" ry="3" fill="rgba(0,0,0,0.08)"/>
  <path d="M 38 100 L 42 128 Q 60 132 78 128 L 82 100 Z" fill="#8B7355"/>
  <ellipse cx="60" cy="100" rx="23" ry="5" fill="#6d5537"/>
  <ellipse cx="60" cy="100" rx="20" ry="3.5" fill="#5C4A2A"/>
  <path d="M 50 100 Q 48 65 46 25 Q 47 20 50 18 Q 53 20 52 25 Q 52 65 51 100 Z" fill="#2E7D32"/>
  <path d="M 50 100 Q 48 65 47 30" stroke="#FDD835" stroke-width="0.8" opacity="0.25" fill="none"/>
  <path d="M 49 55 Q 51 53 53 55" stroke="#1B5E20" stroke-width="0.4" opacity="0.3" fill="none"/>
  <path d="M 56 100 Q 55 60 53 22 Q 55 16 58 14 Q 61 16 60 22 Q 58 60 57 100 Z" fill="#1B5E20"/>
  <path d="M 56 100 Q 55 60 54 28" stroke="#FDD835" stroke-width="0.8" opacity="0.2" fill="none"/>
  <path d="M 62 100 Q 63 55 65 20 Q 66 15 68 13 Q 71 15 70 20 Q 68 55 67 100 Z" fill="#388E3C"/>
  <path d="M 62 100 Q 63 55 65 25" stroke="#FDD835" stroke-width="0.7" opacity="0.25" fill="none"/>
  <path d="M 45 100 Q 43 72 40 38 Q 41 33 43 31 Q 46 33 45 38 Q 44 72 44 100 Z" fill="#43A047"/>
  <path d="M 70 100 Q 72 68 74 35 Q 75 30 77 28 Q 79 30 78 35 Q 76 68 75 100 Z" fill="#2E7D32"/>
</svg>
    </div>
  </div>

  <!-- Punchline - BIG -->
  <div style="opacity:0; animation: fadeInUp 0.6s ease-out 8.5s forwards;
    font-family:Georgia,'Times New Roman',serif;font-size:52px;
    color:#9ab06a;font-style:italic">
    it thawed a little.</div>

  <div style="opacity:0; animation: fadeIn 0.3s ease-out 10.0s forwards;
    font-size:16px;color:#9a8f84;letter-spacing:2px">bloomday.app</div>
</div></body></html>
