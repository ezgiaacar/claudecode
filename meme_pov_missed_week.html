<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1920px;
    background:#2a2520;
    font-family:'DM Sans',Arial,Helvetica,sans-serif;
    overflow:hidden;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(60px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity:0; transform:translateY(-40px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity:0; transform:scale(0.5); }
    to { opacity:1; transform:scale(1); }
  }
  @keyframes scalePop {
    0% { opacity:0; transform:scale(0.3); }
    70% { opacity:1; transform:scale(1.15); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes shakeNo {
    0%, 100% { transform:translateX(0); }
    20% { transform:translateX(-12px); }
    40% { transform:translateX(12px); }
    60% { transform:translateX(-8px); }
    80% { transform:translateX(8px); }
  }
  @keyframes gentleSway {
    0%, 100% { transform:rotate(0deg); }
    25% { transform:rotate(3deg); }
    75% { transform:rotate(-3deg); }
  }
  @keyframes slideInLeft {
    from { opacity:0; transform:translateX(-120px); }
    to { opacity:1; transform:translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity:0; transform:translateX(120px); }
    to { opacity:1; transform:translateX(0); }
  }
  @keyframes strikethrough {
    from { width: 0; }
    to { width: 100%; }
  }
  @keyframes dropIn {
    0% { opacity:0; transform:translateY(-200px) rotate(-10deg); }
    60% { opacity:1; transform:translateY(20px) rotate(2deg); }
    80% { transform:translateY(-8px) rotate(-1deg); }
    100% { opacity:1; transform:translateY(0) rotate(0deg); }
  }
  @keyframes float {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-15px); }
  }
  @keyframes typewriter {
    from { clip-path: inset(0 100% 0 0); }
    to { clip-path: inset(0 0% 0 0); }
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 20px rgba(154,176,106,0.3); }
    50% { text-shadow: 0 0 40px rgba(154,176,106,0.8), 0 0 80px rgba(154,176,106,0.4); }
  }
</style>
</head><body>
<div style="width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;padding:100px 70px 80px;
  text-align:center">

  <!-- POV badge drops in -->
  <div style="opacity:0; animation: dropIn 0.8s ease-out 0.3s forwards;">
    <div style="background:#f5f0e8;color:#2a2520;font-size:110px;font-weight:700;
      letter-spacing:-2px;padding:10px 52px 18px;border-radius:28px;
      line-height:1;display:inline-block">POV</div>
  </div>

  <!-- Title -->
  <div style="opacity:0; animation: fadeIn 0.8s ease-out 1.0s forwards;
    font-family:Georgia,'Times New Roman',serif;font-size:52px;
    color:#f5f0e8;line-height:1.1">
    you missed a<br>whole week.</div>

  <!-- Lines appear one by one -->
  <div style="display:flex;flex-direction:column;gap:6px;text-align:left;
    width:100%;padding:0 20px">
    
        <div style="opacity:0; animation: fadeInUp 0.5s ease-out 1.8s forwards;
          font-size:24px; color:#9a8f84; line-height:1.6; font-weight:400">
          You open the app after a week.</div>
        <div style="opacity:0; animation: fadeInUp 0.5s ease-out 3.0s forwards;
          font-size:28px; color:#f5f0e8; line-height:1.6; font-weight:400">
          No notification.</div>
        <div style="opacity:0; animation: fadeInUp 0.5s ease-out 4.0s forwards;
          font-size:28px; color:#f5f0e8; line-height:1.6; font-weight:400">
          No broken streak.</div>
        <div style="opacity:0; animation: fadeInUp 0.5s ease-out 5.0s forwards;
          font-size:28px; color:#f5f0e8; line-height:1.6; font-weight:400">
          No guilt trip.</div>
        <div style="opacity:0; animation: fadeInUp 0.5s ease-out 6.2s forwards;
          font-size:32px; color:#9ab06a; line-height:1.6; font-weight:600">
          Just your ZZ plant.</div>
        <div style="opacity:0; animation: fadeInUp 0.5s ease-out 7.2s forwards;
          font-size:32px; color:#9ab06a; line-height:1.6; font-weight:600">
          Standing there.</div>
        <div style="opacity:0; animation: fadeInUp 0.5s ease-out 8.0s forwards;
          font-size:36px; color:#9ab06a; line-height:1.6; font-weight:600">
          Like nothing happened.</div>
  </div>

  <!-- Plant drops in at the end -->
  <div style="opacity:0; animation: dropIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 9.0s forwards;">
    <div style="animation: gentleSway 3s ease-in-out 10s infinite;">
      <svg viewBox="0 0 120 140" width="320" height="360" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="60" cy="134" rx="24" ry="3" fill="rgba(0,0,0,0.08)"/>
  <path d="M 38 100 L 42 128 Q 60 132 78 128 L 82 100 Z" fill="#B8714E"/>
  <ellipse cx="60" cy="100" rx="23" ry="5" fill="#9a5330"/>
  <ellipse cx="60" cy="100" rx="20" ry="3.5" fill="#5C4A2A"/>
  <path d="M 45 100 Q 42 60 40 20" stroke="#2E7D32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 65 100 Q 68 60 70 25" stroke="#388E3C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <g>
    <ellipse cx="36" cy="30" rx="6" ry="3.5" fill="#1B5E20" transform="rotate(-20,36,30)"/>
    <ellipse cx="48" cy="35" rx="6" ry="3.5" fill="#1B5E20" transform="rotate(15,48,35)"/>
    <ellipse cx="35" cy="45" rx="6.5" ry="3.5" fill="#2E7D32" transform="rotate(-18,35,45)"/>
    <ellipse cx="49" cy="50" rx="6.5" ry="3.5" fill="#2E7D32" transform="rotate(12,49,50)"/>
    <ellipse cx="36" cy="62" rx="7" ry="4" fill="#388E3C" transform="rotate(-15,36,62)"/>
    <ellipse cx="50" cy="67" rx="7" ry="4" fill="#388E3C" transform="rotate(10,50,67)"/>
    <ellipse cx="38" cy="80" rx="7.5" ry="4" fill="#43A047" transform="rotate(-10,38,80)"/>
    <ellipse cx="52" cy="85" rx="7.5" ry="4" fill="#43A047" transform="rotate(8,52,85)"/>
    <ellipse cx="62" cy="35" rx="6" ry="3.5" fill="#2E7D32" transform="rotate(-15,62,35)"/>
    <ellipse cx="76" cy="40" rx="6" ry="3.5" fill="#2E7D32" transform="rotate(18,76,40)"/>
    <ellipse cx="62" cy="52" rx="6.5" ry="3.5" fill="#388E3C" transform="rotate(-12,62,52)"/>
    <ellipse cx="76" cy="57" rx="6.5" ry="3.5" fill="#388E3C" transform="rotate(15,76,57)"/>
    <ellipse cx="64" cy="70" rx="7" ry="4" fill="#43A047" transform="rotate(-8,64,70)"/>
    <ellipse cx="78" cy="75" rx="7" ry="4" fill="#43A047" transform="rotate(10,78,75)"/>
    <ellipse cx="66" cy="88" rx="7.5" ry="4" fill="#4CAF50" transform="rotate(-5,66,88)"/>
  </g>
  <ellipse cx="36" cy="44" rx="2" ry="1" fill="white" opacity="0.08" transform="rotate(-18,36,44)"/>
  <ellipse cx="76" cy="56" rx="2" ry="1" fill="white" opacity="0.08"/>
</svg>
    </div>
  </div>

  <div style="opacity:0; animation: fadeIn 0.5s ease-out 10.5s forwards;
    font-size:20px;color:#9ab06a;letter-spacing:1px">
    because nothing happened.</div>

  <div style="opacity:0; animation: fadeInUp 0.5s ease-out 11.5s forwards;
    font-size:15px;color:#9a8f84;letter-spacing:2px">bloomday.app · free forever</div>
</div></body></html>
