<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#FAFAF7"/>

  <!-- Main text -->
  <text x="540" y="380" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#2A2A2A" letter-spacing="-1">I designed my app</text>
  <text x="540" y="460" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#2A2A2A" letter-spacing="-1">to be <tspan font-style="italic" fill="#D4907F">boring</tspan> on purpose.</text>

  <!-- Subtitle -->
  <text x="540" y="560" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#888" letter-spacing="3">Here's why.</text>

  <!-- Tiny plant icon -->
  <g transform="translate(540, 880)">
    <!-- Stem -->
    <line x1="0" y1="30" x2="0" y2="-10" stroke="#3D6B4F" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leaves -->
    <ellipse cx="-10" cy="-5" rx="8" ry="4.5" fill="#3D6B4F" transform="rotate(-30,-10,-5)" opacity="0.8"/>
    <ellipse cx="10" cy="-12" rx="8" ry="4.5" fill="#3D6B4F" transform="rotate(30,10,-12)" opacity="0.9"/>
    <ellipse cx="-2" cy="-20" rx="7" ry="4" fill="#3D6B4F" transform="rotate(-10,-2,-20)"/>
    <!-- Soil dot -->
    <ellipse cx="0" cy="32" rx="14" ry="4" fill="#C4A882" opacity="0.4"/>
  </g>

  <!-- Swipe indicator -->
  <text x="540" y="1030" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#CCC" letter-spacing="2">SWIPE</text>
  <path d="M570 1035 L580 1040 L570 1045" fill="none" stroke="#CCC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
