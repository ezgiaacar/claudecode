<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#FAFAF7"/>

  <!-- Top text -->
  <text x="540" y="130" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#2A2A2A" letter-spacing="-0.5">
    <tspan x="540" dy="0">Every productivity app I tried</tspan>
    <tspan x="540" dy="50">had the same problem:</tspan>
  </text>

  <!-- Cluttered app mockup -->
  <g transform="translate(140, 250)">
    <!-- Phone frame -->
    <rect x="100" y="0" width="600" height="560" rx="24" fill="white" stroke="#DDD" stroke-width="2"/>

    <!-- Top bar with too many icons -->
    <rect x="100" y="0" width="600" height="56" rx="24" fill="#4A6CF7"/>
    <rect x="596" y="0" width="104" height="28" rx="0 24 0 0" fill="#4A6CF7"/>
    <circle cx="132" cy="28" r="10" fill="white" opacity="0.8"/>
    <rect x="152" y="20" width="80" height="16" rx="4" fill="white" opacity="0.6"/>
    <circle cx="640" cy="28" r="9" fill="white" opacity="0.7"/>
    <circle cx="670" cy="28" r="9" fill="#FF4444" opacity="0.9"/>
    <text x="670" y="33" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="white">5</text>
    <rect x="580" y="18" width="40" height="20" rx="4" fill="#FF8800" opacity="0.9"/>
    <text x="600" y="32" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="white">PRO</text>

    <!-- Overwhelming sidebar tabs -->
    <rect x="100" y="56" width="130" height="504" fill="#F0F0F5"/>
    <rect x="110" y="68" width="110" height="32" rx="6" fill="#4A6CF7"/>
    <text x="165" y="89" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="600">Inbox</text>
    <circle cx="210" cy="84" r="8" fill="#FF4444"/>
    <text x="210" y="88" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="white">12</text>

    <rect x="110" y="108" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="126" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Today</text>
    <rect x="110" y="142" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Upcoming</text>
    <rect x="110" y="176" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="194" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Projects</text>
    <rect x="110" y="210" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="228" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Tags</text>
    <rect x="110" y="244" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="262" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Filters</text>
    <rect x="110" y="278" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="296" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Calendar</text>
    <rect x="110" y="312" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="330" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Templates</text>
    <rect x="110" y="346" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="364" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Goals</text>
    <rect x="110" y="380" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="398" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Analytics</text>
    <rect x="110" y="414" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="432" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Integrations</text>
    <rect x="110" y="448" width="110" height="28" rx="6" fill="white"/>
    <text x="165" y="466" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Settings</text>
    <rect x="110" y="482" width="110" height="28" rx="6" fill="#FFE800" opacity="0.6"/>
    <text x="165" y="500" text-anchor="middle" font-family="Arial" font-size="10" fill="#333" font-weight="600">Upgrade!</text>

    <!-- Main content area crammed with stuff -->
    <rect x="230" y="56" width="470" height="504" fill="white"/>

    <!-- Sub-tabs -->
    <rect x="240" y="66" width="55" height="24" rx="4" fill="#4A6CF7"/>
    <text x="267" y="82" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Board</text>
    <rect x="300" y="66" width="45" height="24" rx="4" fill="#EEE"/>
    <text x="322" y="82" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">List</text>
    <rect x="350" y="66" width="65" height="24" rx="4" fill="#EEE"/>
    <text x="382" y="82" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">Timeline</text>
    <rect x="420" y="66" width="55" height="24" rx="4" fill="#EEE"/>
    <text x="447" y="82" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">Gantt</text>
    <rect x="480" y="66" width="60" height="24" rx="4" fill="#EEE"/>
    <text x="510" y="82" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">Matrix</text>
    <rect x="545" y="66" width="50" height="24" rx="4" fill="#EEE"/>
    <text x="570" y="82" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">Map</text>
    <rect x="600" y="66" width="20" height="24" rx="4" fill="#EEE"/>
    <text x="610" y="82" text-anchor="middle" font-family="Arial" font-size="14" fill="#777">+</text>

    <!-- Task rows with tons of metadata -->
    <g transform="translate(240, 100)">
      <rect x="0" y="0" width="450" height="44" rx="4" fill="#FFF5F5" stroke="#FFD4D4" stroke-width="1"/>
      <circle cx="16" cy="22" r="8" fill="none" stroke="#FF4444" stroke-width="2"/>
      <text x="32" y="26" font-family="Arial" font-size="12" fill="#333">Fix urgent production bug</text>
      <rect x="250" y="10" width="50" height="18" rx="3" fill="#FF4444"/>
      <text x="275" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="600">URGENT</text>
      <rect x="305" y="10" width="35" height="18" rx="3" fill="#FF8800"/>
      <text x="322" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="white">P1</text>
      <rect x="345" y="10" width="40" height="18" rx="3" fill="#E0E0FF"/>
      <text x="365" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#4A6CF7">Sprint 4</text>
      <rect x="390" y="10" width="50" height="18" rx="3" fill="#FFE0D0"/>
      <text x="415" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#CC5500">Overdue</text>

      <rect x="0" y="50" width="450" height="44" rx="4" fill="white" stroke="#EEE" stroke-width="1"/>
      <circle cx="16" cy="22" r="8" fill="none" stroke="#4A6CF7" stroke-width="2"/>
      <text x="32" y="26" font-family="Arial" font-size="12" fill="#333">Review Q3 report draft</text>
      <rect x="220" y="10" width="40" height="18" rx="3" fill="#FFE800"/>
      <text x="240" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">Med</text>
      <rect x="265" y="10" width="55" height="18" rx="3" fill="#D4F5D4"/>
      <text x="292" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#2A7A2A">In Review</text>
      <rect x="325" y="10" width="35" height="18" rx="3" fill="#E8E0F0"/>
      <text x="342" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#7744AA">Q3</text>
      <circle cx="380" cy="22" r="10" fill="#DDD"/>
      <text x="380" y="26" text-anchor="middle" font-family="Arial" font-size="9" fill="#777">JD</text>
      <circle cx="400" cy="22" r="10" fill="#DDD"/>
      <text x="400" y="26" text-anchor="middle" font-family="Arial" font-size="9" fill="#777">AK</text>

      <rect x="0" y="100" width="450" height="44" rx="4" fill="white" stroke="#EEE" stroke-width="1"/>
      <circle cx="16" cy="22" r="8" fill="none" stroke="#CCC" stroke-width="2"/>
      <text x="32" y="26" font-family="Arial" font-size="12" fill="#333">Plan team offsite agenda</text>
      <rect x="230" y="10" width="45" height="18" rx="3" fill="#E0F0FF"/>
      <text x="252" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#2266CC">Planning</text>
      <rect x="280" y="10" width="55" height="18" rx="3" fill="#FFF0E0"/>
      <text x="307" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#CC7700">Tomorrow</text>
      <rect x="340" y="10" width="50" height="18" rx="3" fill="#F0E0F0"/>
      <text x="365" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#884488">Recurring</text>
      <rect x="395" y="10" width="44" height="18" rx="3" fill="#E0E0E0"/>
      <text x="417" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">3 deps</text>

      <rect x="0" y="150" width="450" height="44" rx="4" fill="white" stroke="#EEE" stroke-width="1"/>
      <circle cx="16" cy="22" r="8" fill="none" stroke="#CCC" stroke-width="2"/>
      <text x="32" y="26" font-family="Arial" font-size="12" fill="#333">Update design system docs</text>
      <rect x="250" y="10" width="35" height="18" rx="3" fill="#44BB44"/>
      <text x="267" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Low</text>
      <rect x="290" y="10" width="65" height="18" rx="3" fill="#E0E0FF"/>
      <text x="322" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#4A6CF7">Backlog</text>

      <rect x="0" y="200" width="450" height="44" rx="4" fill="white" stroke="#EEE" stroke-width="1"/>
      <circle cx="16" cy="22" r="8" fill="none" stroke="#CCC" stroke-width="2"/>
      <text x="32" y="26" font-family="Arial" font-size="12" fill="#999">+ 14 more tasks...</text>
      <rect x="200" y="10" width="60" height="18" rx="3" fill="#FFE800" opacity="0.5"/>
      <text x="230" y="23" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Collapse</text>
    </g>

    <!-- Bottom nav bar with icons -->
    <rect x="230" y="510" width="470" height="50" fill="#F8F8FA" stroke="#EEE" stroke-width="1 0 0 0"/>
    <text x="290" y="540" text-anchor="middle" font-family="Arial" font-size="10" fill="#4A6CF7" font-weight="600">Home</text>
    <text x="370" y="540" text-anchor="middle" font-family="Arial" font-size="10" fill="#999">Search</text>
    <text x="450" y="540" text-anchor="middle" font-family="Arial" font-size="10" fill="#999">Create</text>
    <text x="530" y="540" text-anchor="middle" font-family="Arial" font-size="10" fill="#999">Stats</text>
    <text x="610" y="540" text-anchor="middle" font-family="Arial" font-size="10" fill="#999">Profile</text>

    <!-- Floating notification popup -->
    <rect x="350" y="340" width="260" height="90" rx="12" fill="white" stroke="#DDD" stroke-width="1.5" filter="url(#shadow3)"/>
    <circle cx="380" cy="370" r="14" fill="#4A6CF7"/>
    <text x="380" y="375" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">!</text>
    <text x="405" y="368" font-family="Arial" font-size="12" fill="#333" font-weight="600">Don't forget!</text>
    <text x="405" y="386" font-family="Arial" font-size="10" fill="#888">You have 3 overdue tasks</text>
    <text x="405" y="404" font-family="Arial" font-size="10" fill="#888">and 5 unread messages</text>
    <rect x="555" y="348" width="46" height="20" rx="10" fill="#FF4444"/>
    <text x="578" y="362" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="600">NEW</text>

    <!-- Floating action button -->
    <circle cx="660" cy="510" r="24" fill="#4A6CF7"/>
    <text x="660" y="518" text-anchor="middle" font-family="Arial" font-size="28" fill="white" font-weight="300">+</text>
  </g>

  <defs>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Label -->
  <text x="540" y="880" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#888" font-style="italic">
    <tspan x="540" dy="0">This is what "helpful" looks like</tspan>
    <tspan x="540" dy="36">to most apps.</tspan>
  </text>
</svg>
