<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#FAFAF7"/>

  <!-- Question -->
  <text x="540" y="220" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#888" letter-spacing="0.5">What happens when</text>
  <text x="540" y="270" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#888" letter-spacing="0.5">you miss a day?</text>

  <!-- Big answer -->
  <text x="540" y="420" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#3D6B4F" letter-spacing="-2">Nothing.</text>

  <!-- Supporting text -->
  <text x="540" y="520" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#2A2A2A" letter-spacing="0.3">Your garden doesn't die.</text>
  <text x="540" y="575" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#D4907F" letter-spacing="0.3" font-style="italic">It waits.</text>

  <!-- Small calm garden illustration -->
  <g transform="translate(540, 800)">
    <!-- Soft ground -->
    <ellipse cx="0" cy="50" rx="220" ry="25" fill="#E8DFD0" opacity="0.45"/>

    <!-- Plants sitting peacefully -->
    <!-- Left herb -->
    <g transform="translate(-150, 0)">
      <line x1="0" y1="40" x2="0" y2="8" stroke="#3D6B4F" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-8" cy="14" rx="7" ry="4" fill="#6B8F71" transform="rotate(-20,-8,14)"/>
      <ellipse cx="8" cy="8" rx="7" ry="4" fill="#8FB996" transform="rotate(20,8,8)"/>
      <ellipse cx="-2" cy="2" rx="6" ry="3.5" fill="#6B8F71"/>
    </g>
    <!-- Left flower -->
    <g transform="translate(-80, -10)">
      <line x1="0" y1="50" x2="0" y2="12" stroke="#3D6B4F" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="8" r="8" fill="#D4907F" opacity="0.75"/>
      <circle cx="0" cy="8" r="4" fill="#E8C4B8" opacity="0.5"/>
      <ellipse cx="-6" cy="32" rx="5" ry="3" fill="#6B8F71" transform="rotate(-15,-6,32)"/>
    </g>
    <!-- Center sprout -->
    <g transform="translate(-10, 5)">
      <line x1="0" y1="35" x2="0" y2="8" stroke="#6B8F71" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="-5" cy="12" rx="5" ry="3" fill="#8FB996" transform="rotate(-25,-5,12)"/>
      <ellipse cx="5" cy="6" rx="5" ry="3" fill="#6B8F71" transform="rotate(20,5,6)"/>
    </g>
    <!-- Right succulent -->
    <g transform="translate(60, 15)">
      <ellipse cx="-5" cy="18" rx="5" ry="9" fill="#8FB996" transform="rotate(-15,-5,18)"/>
      <ellipse cx="5" cy="18" rx="5" ry="9" fill="#6B8F71" transform="rotate(15,5,18)"/>
      <ellipse cx="0" cy="14" rx="4" ry="8" fill="#8FB996"/>
    </g>
    <!-- Right lavender -->
    <g transform="translate(130, -5)">
      <line x1="0" y1="45" x2="0" y2="5" stroke="#3D6B4F" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="22" r="3.5" fill="#B8A9C9" opacity="0.7"/>
      <circle cx="0" cy="14" r="3.5" fill="#B8A9C9" opacity="0.8"/>
      <circle cx="0" cy="6" r="4" fill="#B8A9C9" opacity="0.9"/>
      <ellipse cx="-5" cy="34" rx="4" ry="2.5" fill="#6B8F71" transform="rotate(-12,-5,34)"/>
    </g>

    <!-- Small empty spots (waiting) -->
    <circle cx="-40" cy="48" r="3" fill="#C4A882" opacity="0.25"/>
    <circle cx="100" cy="50" r="3" fill="#C4A882" opacity="0.25"/>
    <circle cx="170" cy="46" r="3" fill="#C4A882" opacity="0.25"/>
  </g>
</svg>
